services:
  postgres:
    image: postgres:16-alpine
    container_name: library-postgres-prod
    environment:
      POSTGRES_DB: ${DB_NAME:?DB_NAME must be set in .env.prod}
      POSTGRES_USER: ${DB_USER:?DB_USER must be set in .env.prod}
      POSTGRES_PASSWORD: ${DB_PASS:?DB_PASS must be set in .env.prod}
    volumes:
      - postgres_prod_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:4-management-alpine
    container_name: library-rabbitmq-prod
    hostname: library-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:?RABBITMQ_USER must be set in .env.prod}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASS:?RABBITMQ_PASS must be set in .env.prod}
    volumes:
      - rabbitmq_prod_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  library-api:
    build: .
    container_name: library-api-prod
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_URL: jdbc:postgresql://postgres:5432/${DB_NAME:?DB_NAME must be set in .env.prod}
      DB_USER: ${DB_USER:?DB_USER must be set in .env.prod}
      DB_PASS: ${DB_PASS:?DB_PASS must be set in .env.prod}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set in .env.prod}
      DB_SCHEMA_INIT_MODE: ${DB_SCHEMA_INIT_MODE:-never}
      DB_SEED_DATA_LOCATIONS: ${DB_SEED_DATA_LOCATIONS:-classpath:data.sql}
      JWT_EXPIRATION: ${JWT_EXPIRATION:-3600000}
      JWT_REFRESH_EXPIRATION: ${JWT_REFRESH_EXPIRATION:-86400000}
      JWT_ISSUER: ${JWT_ISSUER:-library-api}
      JWT_AUDIENCE: ${JWT_AUDIENCE:-library-api-clients}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:?CORS_ALLOWED_ORIGINS must be set in .env.prod}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USER: ${RABBITMQ_USER:?RABBITMQ_USER must be set in .env.prod}
      RABBITMQ_PASS: ${RABBITMQ_PASS:?RABBITMQ_PASS must be set in .env.prod}
    ports:
      - "${API_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_prod_data:
  rabbitmq_prod_data:
