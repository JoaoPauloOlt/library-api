name: CI

on:
  push:
    branches: [ main, develop, 'feature/**', 'fix/**', 'refactor/**', 'quality/**', 'chore/**', 'docs/**' ]
  pull_request:
    branches: [ develop, main ]

permissions:
  contents: read
  checks: read
  pull-requests: read

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: library
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d library"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      SPRING_PROFILES_ACTIVE: test
      DB_URL: jdbc:postgresql://localhost:5432/library
      TEST_DB_URL: jdbc:postgresql://localhost:5432/library_test
      PROD_SCHEMA_TEST_DB_URL: jdbc:postgresql://localhost:5432/library_schema
      DB_USER: postgres
      DB_PASS: postgres
      JWT_SECRET: library-api-ci-secret-with-underscores-2026
      JWT_EXPIRATION: 3600000
      JWT_REFRESH_EXPIRATION: 86400000

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Create isolated test databases
        shell: bash
        run: |
          postgres_container="$(docker ps --filter 'ancestor=postgres:16' --format '{{.ID}}' | head -n 1)"
          if [ -z "$postgres_container" ]; then
            echo "PostgreSQL service container was not found."
            exit 1
          fi
          docker exec "$postgres_container" psql -U postgres -d postgres -v ON_ERROR_STOP=1 \
            -c "CREATE DATABASE library_test;" \
            -c "CREATE DATABASE library_schema;" \
            -c "CREATE DATABASE library_migrations;"

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Run tests and coverage
        run: mvn -B verify
      - name: Validate manual PostgreSQL migrations
        shell: bash
        run: |
          set -euo pipefail
          postgres_container="$(docker ps --filter 'ancestor=postgres:16' --format '{{.ID}}' | head -n 1)"
          if [ -z "$postgres_container" ]; then
            echo "PostgreSQL service container was not found."
            exit 1
          fi

          migration_db="library_migrations"
          docker exec -i "$postgres_container" psql -U postgres -d "$migration_db" -v ON_ERROR_STOP=1 < src/main/resources/schema.sql
          docker exec -i "$postgres_container" psql -U postgres -d "$migration_db" -v ON_ERROR_STOP=1 < src/main/resources/db/manual-migrations/2026-11-13-reserve-book-copies.sql

          # A same-named index with an incorrect predicate must be rejected.
          docker exec "$postgres_container" psql -U postgres -d "$migration_db" -v ON_ERROR_STOP=1 \
            -c "DROP INDEX uq_loans_one_open_per_copy;" \
            -c "CREATE UNIQUE INDEX uq_loans_one_open_per_copy ON loans(book_copy_id) WHERE status = 'ACTIVE';"
          if docker exec -i "$postgres_container" psql -U postgres -d "$migration_db" -v ON_ERROR_STOP=1 < src/main/resources/db/manual-migrations/2026-11-20-one-open-loan-per-copy.sql; then
            echo "The migration incorrectly accepted an index with a different predicate."
            exit 1
          fi

          # The correct migration must create the index and remain idempotent.
          docker exec "$postgres_container" psql -U postgres -d "$migration_db" -v ON_ERROR_STOP=1 -c "DROP INDEX uq_loans_one_open_per_copy;"
          docker exec -i "$postgres_container" psql -U postgres -d "$migration_db" -v ON_ERROR_STOP=1 < src/main/resources/db/manual-migrations/2026-11-20-one-open-loan-per-copy.sql
          docker exec -i "$postgres_container" psql -U postgres -d "$migration_db" -v ON_ERROR_STOP=1 < src/main/resources/db/manual-migrations/2026-11-20-one-open-loan-per-copy.sql

          # Simulate a legacy nullable timestamp and verify the forward migration.
          docker exec "$postgres_container" psql -U postgres -d "$migration_db" -v ON_ERROR_STOP=1 \
            -c "ALTER TABLE book_copies ALTER COLUMN updated_at DROP NOT NULL;" \
            -c "INSERT INTO books (isbn, title, genre) VALUES ('9780000000002', 'Legacy timestamp fixture', 'DRAMA');" \
            -c "INSERT INTO book_copies (book_id, barcode, status, updated_at) SELECT id, 'MIGRATION-LEGACY-001', 'AVAILABLE', NULL FROM books WHERE isbn = '9780000000002';"
          docker exec -i "$postgres_container" psql -U postgres -d "$migration_db" -v ON_ERROR_STOP=1 < src/main/resources/db/manual-migrations/2026-11-20-book-copy-updated-at-not-null.sql

          nullable="$(docker exec "$postgres_container" psql -U postgres -d "$migration_db" -At -c "SELECT is_nullable FROM information_schema.columns WHERE table_schema = 'public' AND table_name = 'book_copies' AND column_name = 'updated_at';")"
          null_rows="$(docker exec "$postgres_container" psql -U postgres -d "$migration_db" -At -c "SELECT COUNT(*) FROM book_copies WHERE updated_at IS NULL;")"
          test "$nullable" = "NO"
          test "$null_rows" = "0"


      # Issue #39: keep the generated coverage report available for objective analysis.
      # The artifact is retained independently from the Maven 80% gate.
      - name: Publish JaCoCo report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: target/site/jacoco/
          if-no-files-found: warn

      - name: Print JaCoCo coverage summary
        if: always()
        shell: bash
        run: |
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          from pathlib import Path

          report = Path("target/site/jacoco/jacoco.xml")
          if not report.exists():
              print("JaCoCo report not found: target/site/jacoco/jacoco.xml")
              raise SystemExit(0)

          root = ET.parse(report).getroot()
          counters = {c.attrib["type"]: c.attrib for c in root.findall("counter")}
          line = counters.get("LINE")
          if not line:
              print("JaCoCo LINE counter not found")
              raise SystemExit(0)

          covered = int(line["covered"])
          missed = int(line["missed"])
          total = covered + missed
          percentage = (covered / total * 100) if total else 0
          print(f"JaCoCo global LINE coverage: {covered}/{total} = {percentage:.2f}%")
          print(f"JaCoCo report: {report}")
          PY

      # SonarCloud analysis and its Quality Gate are blocking for pull requests
      # and main-branch analysis.
      - name: SonarCloud analysis
        if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: https://sonarcloud.io
        run: mvn -B org.sonarsource.scanner.maven:sonar-maven-plugin:5.8.0.7211:sonar -Dsonar.qualitygate.wait=true -Dsonar.qualitygate.timeout=300
