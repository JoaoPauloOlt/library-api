name: CI

on:
  push:
    branches: [ main, develop, 'feature/**', 'fix/**', 'refactor/**', 'quality/**' ]
  pull_request:
    branches: [ develop, main ]

permissions:
  contents: read
  checks: read
  pull-requests: read

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: library
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d library"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      SPRING_PROFILES_ACTIVE: test
      DB_URL: jdbc:postgresql://localhost:5432/library
      TEST_DB_URL: jdbc:postgresql://localhost:5432/library_test
      PROD_SCHEMA_TEST_DB_URL: jdbc:postgresql://localhost:5432/library_schema
      DB_USER: postgres
      DB_PASS: postgres
      JWT_SECRET: library-api-ci-secret-with-underscores-2026
      JWT_EXPIRATION: 3600000
      JWT_REFRESH_EXPIRATION: 86400000

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Create isolated test databases
        shell: bash
        run: |
          postgres_container="$(docker ps --filter 'ancestor=postgres:16' --format '{{.ID}}' | head -n 1)"
          if [ -z "$postgres_container" ]; then
            echo "PostgreSQL service container was not found."
            exit 1
          fi
          docker exec "$postgres_container" psql -U postgres -d postgres -v ON_ERROR_STOP=1 \
            -c "CREATE DATABASE library_test;" \
            -c "CREATE DATABASE library_schema;"

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Run tests and coverage
        run: mvn -B verify

      # Issue #39: keep the generated coverage report available for objective analysis.
      # The artifact is retained independently from the Maven 80% gate.
      - name: Publish JaCoCo report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: target/site/jacoco/
          if-no-files-found: warn

      - name: Print JaCoCo coverage summary
        if: always()
        shell: bash
        run: |
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          from pathlib import Path

          report = Path("target/site/jacoco/jacoco.xml")
          if not report.exists():
              print("JaCoCo report not found: target/site/jacoco/jacoco.xml")
              raise SystemExit(0)

          root = ET.parse(report).getroot()
          counters = {c.attrib["type"]: c.attrib for c in root.findall("counter")}
          line = counters.get("LINE")
          if not line:
              print("JaCoCo LINE counter not found")
              raise SystemExit(0)

          covered = int(line["covered"])
          missed = int(line["missed"])
          total = covered + missed
          percentage = (covered / total * 100) if total else 0
          print(f"JaCoCo global LINE coverage: {covered}/{total} = {percentage:.2f}%")
          print(f"JaCoCo report: {report}")
          PY

      # SonarCloud's organization plan does not expose branch Quality Gate polling
      # through the scanner API. PRs are gated by the SonarCloud GitHub check below.
      - name: SonarCloud analysis
        if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: https://sonarcloud.io
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "push" && "$GITHUB_REF" == "refs/heads/main" ]]; then
            mvn -B org.sonarsource.scanner.maven:sonar-maven-plugin:5.8.0.7211:sonar \
              -Dsonar.qualitygate.wait=true -Dsonar.qualitygate.timeout=300
          else
            mvn -B org.sonarsource.scanner.maven:sonar-maven-plugin:5.8.0.7211:sonar
          fi

      - name: Wait for SonarCloud Quality Gate
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const headSha = context.payload.pull_request.head.sha;
            const deadline = Date.now() + 300000;

            while (Date.now() < deadline) {
              const { data } = await github.rest.checks.listForRef({
                owner: context.repo.owner,
                repo: context.repo.repo,
                ref: headSha,
                per_page: 100
              });

              const sonarChecks = data.check_runs
                .filter(check => check.name === "SonarCloud Code Analysis")
                .sort((a, b) =>
                  Date.parse(b.started_at || b.created_at) -
                  Date.parse(a.started_at || a.created_at)
                );

              const latest = sonarChecks[0];
              if (latest?.status === "completed") {
                if (latest.conclusion === "success") {
                  core.info("SonarCloud Quality Gate passed.");
                  return;
                }

                core.setFailed(`SonarCloud Quality Gate did not pass: ${latest.conclusion}`);
                return;
              }

              core.info("Waiting for SonarCloud Code Analysis check...");
              await new Promise(resolve => setTimeout(resolve, 5000));
            }

            core.setFailed("Timed out waiting for SonarCloud Code Analysis after 300 seconds.");
