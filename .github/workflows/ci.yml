name: CI

on:
  push:
    branches: [ develop, 'feature/**', 'fix/**', 'refactor/**', 'quality/**' ]
  pull_request:
    branches: [ develop, main ]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: library
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d library"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DB_URL: jdbc:postgresql://localhost:5432/library
      DB_USER: postgres
      DB_PASS: postgres
      JWT_SECRET: bGlicmFyeS1hcGktc2VjcmV0LXRlc3QtMjAyNi0wOC0yNA==

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Run tests and coverage
        run: mvn -B verify

      - name: 📊 Coverage summary
        if: always()
        shell: bash
        run: |
          REPORT="target/site/jacoco/jacoco.csv"

          {
            echo "## 📊 Test Coverage"
            echo ""
            echo "| Metric | Result | Required | Status |"
            echo "|---|---:|---:|---|"
          } >> "$GITHUB_STEP_SUMMARY"

          if [ ! -f "$REPORT" ]; then
            echo "| Line coverage | N/A | **80%** | ❌ Report unavailable |" >> "$GITHUB_STEP_SUMMARY"
            echo ""
            echo "> JaCoCo did not generate a coverage report. Check the test/coverage step above." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          read -r MISSED COVERED <<< "$(awk -F',' 'NR > 1 { missed += $7; covered += $8 } END { print missed, covered }' "$REPORT")"
          TOTAL=$((MISSED + COVERED))

          if [ "$TOTAL" -eq 0 ]; then
            PERCENT="0.00"
            STATUS="❌ Below threshold"
          else
            PERCENT=$(awk -v c="$COVERED" -v t="$TOTAL" 'BEGIN { printf "%.2f", (c / t) * 100 }')
            if awk -v p="$PERCENT" 'BEGIN { exit !(p >= 80) }'; then
              STATUS="✅ Passed"
            else
              STATUS="❌ Below threshold"
            fi
          fi

          echo "| Line coverage | **${PERCENT}%** | **80%** | ${STATUS} |" >> "$GITHUB_STEP_SUMMARY"
          echo ""
          echo "**Covered:** ${COVERED} lines  |  **Missed:** ${MISSED} lines  |  **Total:** ${TOTAL} lines" >> "$GITHUB_STEP_SUMMARY"
          echo ""
          if [ "$STATUS" = "❌ Below threshold" ]; then
            echo "> ❌ **Merge blocked:** line coverage must be at least **80%**." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "> ✅ **Coverage gate passed:** this PR meets the minimum **80%** line coverage requirement." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: SonarCloud analysis
        uses: SonarSource/sonarqube-scan-action@v6
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: https://sonarcloud.io
