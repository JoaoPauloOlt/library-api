services:
  postgres:
    image: postgres:16-alpine
    container_name: library-postgres
    environment:
      POSTGRES_DB: library
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d library"]
      interval: 5s
      timeout: 5s
      retries: 10

  library-api:
    build: .
    container_name: library-api
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_URL: jdbc:postgresql://postgres:5432/library
      DB_USER: postgres
      DB_PASS: postgres
      JWT_SECRET: replace-with-a-strong-base64-secret
      JWT_EXPIRATION: 3600000
      JWT_REFRESH_EXPIRATION: 86400000
      JWT_ISSUER: library-api
      JWT_AUDIENCE: library-api-clients
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
