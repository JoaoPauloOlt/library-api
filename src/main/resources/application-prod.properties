spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASS}
spring.datasource.driver-class-name=org.postgresql.Driver

# Production schema/data initialization is opt-in and must only be enabled for one-time provisioning.
# Normal production restarts never execute schema.sql or data.sql.
spring.sql.init.mode=${DB_SCHEMA_INIT_MODE:never}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.defer-datasource-initialization=false
spring.sql.init.schema-locations=classpath:schema.sql,classpath:db/manual-migrations/2026-11-26-normalize-user-email.sql
spring.sql.init.data-locations=${DB_SEED_DATA_LOCATIONS:classpath:data.sql}
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION}
jwt.refresh-expiration=${JWT_REFRESH_EXPIRATION:86400000}
jwt.issuer=${JWT_ISSUER:library-api}
jwt.audience=${JWT_AUDIENCE:library-api-clients}

logging.pattern.level=%5p [corr:%X{correlationId}]

server.port=${PORT:8080}

app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS}

app.security.refresh-cookie-secure=true
app.security.refresh-cookie-same-site=Lax
app.security.refresh-cookie-max-age-seconds=${JWT_REFRESH_COOKIE_MAX_AGE_SECONDS:86400}