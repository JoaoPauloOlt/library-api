spring.application.name=library-api
# No implicit fallback: every runtime must explicitly select dev, test or prod.
spring.profiles.active=${SPRING_PROFILES_ACTIVE}

# Hibernate runs before SQL initialization in dev/test; prod overrides this to initialize the schema first.
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema.sql
spring.sql.init.data-locations=classpath:data.sql

# Shared messaging infrastructure. Disable in test profile to keep tests broker-independent.
app.messaging.enabled=${MESSAGING_ENABLED:true}
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USER:library}
spring.rabbitmq.password=${RABBITMQ_PASS:library-dev}
spring.rabbitmq.publisher-confirm-type=correlated
spring.rabbitmq.publisher-returns=true
spring.rabbitmq.template.mandatory=true
spring.rabbitmq.listener.simple.acknowledge-mode=manual

# Public endpoint abuse protection. Override through deployment environment variables.
app.security.rate-limit.login-ip.max-attempts=${LOGIN_IP_RATE_LIMIT_MAX_ATTEMPTS:30}
app.security.rate-limit.login-ip.window=${LOGIN_IP_RATE_LIMIT_WINDOW:PT1M}
app.security.rate-limit.registration-ip.max-attempts=${REGISTRATION_IP_RATE_LIMIT_MAX_ATTEMPTS:5}
app.security.rate-limit.registration-ip.window=${REGISTRATION_IP_RATE_LIMIT_WINDOW:PT1H}
app.security.rate-limit.account.max-failed-attempts=${LOGIN_ACCOUNT_RATE_LIMIT_MAX_FAILED_ATTEMPTS:5}
app.security.rate-limit.account.window=${LOGIN_ACCOUNT_RATE_LIMIT_WINDOW:PT15M}
