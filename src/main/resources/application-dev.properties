spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/library}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASS:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.maximum-pool-size=3
spring.datasource.hikari.minimum-idle=1

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Apply reviewed, idempotent local schema adjustments after the initial schema.
spring.sql.init.schema-locations=classpath:schema.sql,classpath:db/manual-migrations/2026-11-13-reserve-book-copies.sql
spring.sql.init.data-locations=classpath:data.sql,classpath:data-dev.sql

jwt.secret=${JWT_SECRET:library-api-local-dev-secret-2026-change-me}
jwt.expiration=${JWT_EXPIRATION:3600000}
jwt.refresh-expiration=${JWT_REFRESH_EXPIRATION:86400000}
jwt.issuer=${JWT_ISSUER:library-api}
jwt.audience=${JWT_AUDIENCE:library-api-clients}

app.errors.expose-details=true

app.cors.allowed-origins=http://localhost:*
